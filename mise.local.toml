[tools]
helm = "3.17.4"
helm-docs = "1.14.2"
kind = "0.29.0"
uv = "0.7.20"


[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.coverage]
description = "Run the test suite with coverage"
run = "uv run pytest"

[tasks.coverage-ui]
description = "Run the test suite with coverage with html view"
run = [
  "uv run pytest",
  "python -m webbrowser .coverage/htmlcov/index.html",
]
