---
name: (Python) Unittest & Coverage

on:
  pull_request:
    # types: [review_requested, ready_for_review]
    paths:
      - "src/**/*.py"
      - pyproject.toml
      - .python-version
      - "uv.lock"
      - .python-version
  push:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - pyproject.toml
      - .python-version
      - "uv.lock"
      - .python-version

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4
        with:
          install: true
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pytest and coverage
        run: |
          set -o pipefail
          mise run ci-test | tee pytest-coverage.txt

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@45d7be6c0a6b6d3c3a5fc40345e8fb4a1c4aa800 # main
        with:
          junitxml-path: .coverage/junit.xml
          title: Coverage Report
          hide-report: false
