# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: RBAC Cluster
templates:
  - cluster-role.yaml
release:
  name: test
  namespace: test-ns
chart:
  version: 0.0.0
  appVersion: 0.0.0
set:
  image:
    repository: ghcr.io/drummyfloyd/crunchy-userinit-controller
    tag: 0.0.0
tests:
  - it: should not create rbac
    set:
      rbac:
        create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create rbac when forceCluster
    set:
      rbac:
        create: false
        forceCluster: true
    asserts:
      - hasDocuments:
          count: 0
  - it: should create clusterRole with watch.mode=all
    set:
      watch:
        mode: all
    asserts:
      - matchSnapshot: {}
  - it: should create cluster role with watch.mode=list
    set:
      watch:
        mode: list
    asserts:
      - matchSnapshot: {}
  - it: should create cluster role on force
    set:
      watch:
        mode: current
      rbac:
        forceCluster: true
    asserts:
      - hasDocuments:
          count: 2
